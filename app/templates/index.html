<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkFlare — URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080b10;
      --surface:   #0d1117;
      --card:      #111820;
      --border:    #1e2d3d;
      --accent:    #00d4ff;
      --accent2:   #ff6b35;
      --green:     #00ff88;
      --red:       #ff4757;
      --text:      #cdd9e5;
      --muted:     #546e7a;
      --white:     #f0f6fc;
      --glow:      0 0 20px rgba(0,212,255,0.15);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .app { position: relative; z-index: 1; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(8,11,16,0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--white);
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--accent); }

    .header-right { display: flex; align-items: center; gap: 1rem; }

    .user-badge {
      display: none;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
    }

    .user-badge.visible { display: flex; }
    .user-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: #00b8d9;
      box-shadow: var(--glow);
    }

    .btn-danger {
      background: transparent;
      border-color: var(--red);
      color: var(--red);
      font-size: 0.7rem;
      padding: 0.3rem 0.6rem;
    }

    .btn-danger:hover { background: var(--red); color: white; }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Auth Page ── */
    #auth-page {
      min-height: calc(100vh - 65px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
    }

    .auth-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 0.4rem;
    }

    .auth-sub {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 2rem;
    }

    .auth-tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      text-align: center;
      cursor: pointer;
      font-size: 0.78rem;
      color: var(--muted);
      background: transparent;
      border: none;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }

    .auth-tab.active {
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
    }

    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); opacity: 0.6; }

    .btn-block { width: 100%; padding: 0.75rem; font-size: 0.85rem; }

    .auth-error {
      background: rgba(255,71,87,0.1);
      border: 1px solid rgba(255,71,87,0.3);
      color: var(--red);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      font-size: 0.78rem;
      margin-bottom: 1rem;
      display: none;
    }

    .auth-error.visible { display: block; }

    /* ── Dashboard ── */
    #dashboard-page { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .dash-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--white);
    }

    .dash-title span { color: var(--muted); font-size: 0.9rem; font-weight: 400; }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
    }

    .stat-card:nth-child(2)::before { background: var(--accent2); }
    .stat-card:nth-child(3)::before { background: var(--green); }

    .stat-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; color: var(--white); }

    /* Create link */
    .create-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .create-card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 1rem;
    }

    .create-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .create-row .form-group { margin-bottom: 0; flex: 1; min-width: 200px; }

    .create-success {
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-top: 1rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .create-success.visible { display: flex; }

    .short-url-display {
      font-size: 0.85rem;
      color: var(--green);
    }

    .short-url-display a { color: var(--green); text-decoration: none; }
    .short-url-display a:hover { text-decoration: underline; }

    .copy-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 0.3rem 0.7rem;
      border-radius: 5px;
      border: 1px solid var(--green);
      background: transparent;
      color: var(--green);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .copy-btn:hover { background: var(--green); color: var(--bg); }
    .copy-btn.copied { background: var(--green); color: var(--bg); }

    /* Links table */
    .links-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .links-card-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .links-card-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--white);
    }

    .refresh-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 0.3rem 0.6rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }

    td {
      padding: 0.9rem 1.5rem;
      font-size: 0.82rem;
      border-bottom: 1px solid rgba(30,45,61,0.5);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(0,212,255,0.03); }

    .code-cell {
      font-weight: 700;
      color: var(--accent);
    }

    .url-cell {
      color: var(--muted);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .clicks-cell { color: var(--white); font-weight: 600; }

    .actions-cell { display: flex; gap: 0.5rem; align-items: center; }

    .view-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 0.3rem 0.6rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-block;
    }

    .view-btn:hover { border-color: var(--accent); color: var(--accent); }

    .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .empty-icon { font-size: 2rem; margin-bottom: 0.75rem; }

    /* ── Analytics Page ── */
    #analytics-page { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 1.5rem;
      transition: color 0.15s;
    }

    .back-btn:hover { color: var(--accent); }

    .analytics-header { margin-bottom: 2rem; }

    .analytics-code {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--white);
    }

    .analytics-code span { color: var(--accent); }

    .analytics-url {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.25rem;
      word-break: break-all;
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 700px) {
      .analytics-grid { grid-template-columns: 1fr; }
    }

    .analytics-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }

    .analytics-card h3 {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .country-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0;
      font-size: 0.8rem;
      border-bottom: 1px solid rgba(30,45,61,0.5);
    }

    .country-row:last-child { border-bottom: none; }
    .country-name { color: var(--text); }
    .country-count { color: var(--accent); font-weight: 700; }

    .country-bar-wrap { flex: 1; margin: 0 0.75rem; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .country-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s ease; }

    .click-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      font-size: 0.75rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(30,45,61,0.5);
      gap: 0.5rem;
    }

    .click-row:last-child { border-bottom: none; }
    .click-time { color: var(--muted); }
    .click-country { color: var(--text); }
    .click-ref { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .click-row-header { color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.78rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s;
      z-index: 999;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-left-color: var(--red); }

    /* Loading */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(0,212,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.4rem;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fade in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-up { animation: fadeUp 0.3s ease forwards; }

    /* Responsive */
    @media (max-width: 600px) {
      header { padding: 1rem; }
      #dashboard-page, #analytics-page { padding: 1rem; }
      .create-row { flex-direction: column; }
      th:nth-child(3), td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Link<span>Flare</span></div>
    <div class="header-right">
      <div class="user-badge" id="user-badge">
        <div class="user-dot"></div>
        <span id="user-email-display"></span>
      </div>
      <button class="btn btn-ghost" id="logout-btn" style="display:none" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Auth Page -->
  <div class="page active" id="auth-page">
    <div class="auth-box fade-up">
      <div class="auth-title">🔥 LinkFlare</div>
      <div class="auth-sub">// shorten urls. track every click.</div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div id="auth-error" class="auth-error"></div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitAuth()" />
      </div>
      <button class="btn btn-primary btn-block" id="auth-btn" onclick="submitAuth()">Login</button>
    </div>
  </div>

  <!-- Dashboard Page -->
  <div class="page" id="dashboard-page">
    <div class="dash-header">
      <div>
        <div class="dash-title">Dashboard <span id="dash-subtitle"></span></div>
      </div>
      <button class="btn btn-ghost" onclick="showCreateFocus()">+ New Link</button>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Links</div>
        <div class="stat-value" id="stat-links">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Clicks</div>
        <div class="stat-value" id="stat-clicks">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top Link</div>
        <div class="stat-value" id="stat-top" style="font-size:1.2rem">—</div>
      </div>
    </div>

    <!-- Create -->
    <div class="create-card" id="create-card">
      <h2>// shorten a url</h2>
      <div class="create-row">
        <div class="form-group" style="flex:2">
          <label>Long URL</label>
          <input type="url" id="new-url" placeholder="https://example.com/very/long/url" />
        </div>
        <div class="form-group">
          <label>Custom Code <span style="color:var(--muted);font-size:0.65rem">(optional)</span></label>
          <input type="text" id="new-code" placeholder="my-link" />
        </div>
        <button class="btn btn-primary" id="create-btn" onclick="createLink()" style="white-space:nowrap;align-self:flex-end;margin-bottom:0">Shorten →</button>
      </div>
      <div class="create-success" id="create-success">
        <div class="short-url-display">
          ✓ <a id="created-url" href="#" target="_blank"></a>
        </div>
        <div style="display:flex;gap:0.5rem">
          <button class="copy-btn" id="copy-btn" onclick="copyShortUrl()">Copy</button>
          <button class="copy-btn" style="border-color:var(--accent);color:var(--accent)" onclick="hideCreateSuccess()">✕</button>
        </div>
      </div>
    </div>

    <!-- Links Table -->
    <div class="links-card">
      <div class="links-card-header">
        <h2>// your links</h2>
        <button class="refresh-btn" onclick="loadLinks()">↻ Refresh</button>
      </div>
      <div id="links-container">
        <div class="empty-state">
          <div class="spinner"></div> Loading...
        </div>
      </div>
    </div>
  </div>

  <!-- Analytics Page -->
  <div class="page" id="analytics-page">
    <button class="back-btn" onclick="showDashboard()">← back to dashboard</button>
    <div class="analytics-header">
      <div class="analytics-code">/<span id="ana-code"></span></div>
      <div class="analytics-url" id="ana-url"></div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Clicks</div>
        <div class="stat-value" id="ana-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Countries</div>
        <div class="stat-value" id="ana-countries">—</div>
      </div>
    </div>

    <div class="analytics-grid">
      <div class="analytics-card">
        <h3>Clicks by Country</h3>
        <div id="ana-country-list"></div>
      </div>
      <div class="analytics-card">
        <h3>Recent Clicks</h3>
        <div class="click-row click-row-header">
          <div>Time</div><div>Country</div><div>Referrer</div>
        </div>
        <div id="ana-recent-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const BASE = window.location.origin;
  let token = localStorage.getItem('lf_token');
  let userEmail = localStorage.getItem('lf_email');
  let lastShortUrl = '';
  let allLinks = [];

  // ── Init ──────────────────────────────────────────────────────────
  function init() {
    if (token) {
      showDashboard();
    }
  }

  // ── Auth ──────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('auth-btn').textContent = tab === 'login' ? 'Login' : 'Create Account';
    document.getElementById('auth-error').classList.remove('visible');
    document.getElementById('auth-btn').dataset.tab = tab;
  }

  async function submitAuth() {
    const tab = document.getElementById('auth-btn').dataset.tab || 'login';
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    errEl.classList.remove('visible');

    if (!email || !password) {
      errEl.textContent = 'Email and password required.';
      errEl.classList.add('visible');
      return;
    }

    const btn = document.getElementById('auth-btn');
    btn.innerHTML = '<span class="spinner"></span>...';
    btn.disabled = true;

    try {
      if (tab === 'register') {
        const r = await fetch(`${BASE}/auth/register`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email, password})
        });
        if (!r.ok) {
          const d = await r.json();
          throw new Error(d.detail || 'Registration failed');
        }
      }

      const r = await fetch(`${BASE}/auth/login`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email, password})
      });

      if (!r.ok) {
        const d = await r.json();
        throw new Error(d.detail || 'Invalid credentials');
      }

      const data = await r.json();
      token = data.access_token;
      userEmail = email;
      localStorage.setItem('lf_token', token);
      localStorage.setItem('lf_email', email);
      showDashboard();
    } catch(e) {
      errEl.textContent = e.message;
      errEl.classList.add('visible');
    } finally {
      btn.innerHTML = tab === 'login' ? 'Login' : 'Create Account';
      btn.disabled = false;
    }
  }

  function logout() {
    token = null;
    userEmail = null;
    localStorage.removeItem('lf_token');
    localStorage.removeItem('lf_email');
    showPage('auth-page');
    document.getElementById('user-badge').classList.remove('visible');
    document.getElementById('logout-btn').style.display = 'none';
  }

  // ── Pages ─────────────────────────────────────────────────────────
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showDashboard() {
    showPage('dashboard-page');
    document.getElementById('user-badge').classList.add('visible');
    document.getElementById('user-email-display').textContent = userEmail || '';
    document.getElementById('logout-btn').style.display = '';
    document.getElementById('dash-subtitle').textContent = `// ${userEmail}`;
    loadLinks();
  }

  function showCreateFocus() {
    document.getElementById('new-url').focus();
  }

  // ── Links ─────────────────────────────────────────────────────────
  async function api(path, opts = {}) {
    const res = await fetch(`${BASE}${path}`, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
        ...(opts.headers || {})
      }
    });
    if (res.status === 401) { logout(); return null; }
    return res;
  }

  async function loadLinks() {
    document.getElementById('links-container').innerHTML = '<div class="empty-state"><span class="spinner"></span> Loading...</div>';
    const res = await api('/links/');
    if (!res) return;
    allLinks = await res.json();

    // Update stats
    const totalClicks = allLinks.reduce((s, l) => s + l.click_count, 0);
    document.getElementById('stat-links').textContent = allLinks.length;
    document.getElementById('stat-clicks').textContent = totalClicks;
    const top = allLinks.sort((a,b) => b.click_count - a.click_count)[0];
    document.getElementById('stat-top').textContent = top ? `/${top.code}` : '—';

    renderLinks(allLinks);
  }

  function renderLinks(links) {
    const container = document.getElementById('links-container');
    if (!links.length) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔗</div>No links yet. Create your first short link above.</div>';
      return;
    }

    const sorted = [...links].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Original URL</th>
            <th>Clicks</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map(link => `
            <tr>
              <td class="code-cell">
                <a href="${link.short_url}" target="_blank" style="color:var(--accent);text-decoration:none">
                  /${link.code}
                </a>
              </td>
              <td class="url-cell" title="${link.original_url}">${link.original_url}</td>
              <td class="clicks-cell">${link.click_count}</td>
              <td style="color:var(--muted);font-size:0.75rem">${formatDate(link.created_at)}</td>
              <td class="actions-cell">
                <button class="view-btn" onclick="showAnalytics('${link.code}')">Analytics</button>
                <button class="copy-btn" onclick="copyText('${link.short_url}', this)">Copy</button>
                <button class="btn btn-danger" onclick="deleteLink('${link.code}')">✕</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  async function createLink() {
    const url = document.getElementById('new-url').value.trim();
    const code = document.getElementById('new-code').value.trim();
    if (!url) { showToast('Enter a URL first', true); return; }

    const btn = document.getElementById('create-btn');
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;

    const body = { original_url: url };
    if (code) body.custom_code = code;

    try {
      const res = await api('/links/', {
        method: 'POST',
        body: JSON.stringify(body)
      });
      if (!res) return;
      const data = await res.json();

      if (!res.ok) {
        showToast(data.detail || 'Failed to create link', true);
        return;
      }

      lastShortUrl = data.short_url;
      document.getElementById('created-url').textContent = data.short_url;
      document.getElementById('created-url').href = data.short_url;
      document.getElementById('create-success').classList.add('visible');
      document.getElementById('new-url').value = '';
      document.getElementById('new-code').value = '';
      document.getElementById('copy-btn').textContent = 'Copy';
      document.getElementById('copy-btn').classList.remove('copied');
      loadLinks();
    } finally {
      btn.textContent = 'Shorten →';
      btn.disabled = false;
    }
  }

  async function deleteLink(code) {
    if (!confirm(`Delete /${code}? This cannot be undone.`)) return;
    const res = await api(`/links/${code}`, { method: 'DELETE' });
    if (res && res.ok) {
      showToast(`/${code} deleted`);
      loadLinks();
    }
  }

  function hideCreateSuccess() {
    document.getElementById('create-success').classList.remove('visible');
  }

  // ── Analytics ─────────────────────────────────────────────────────
  async function showAnalytics(code) {
    showPage('analytics-page');
    document.getElementById('ana-code').textContent = code;
    document.getElementById('ana-url').textContent = 'Loading...';
    document.getElementById('ana-total').textContent = '—';
    document.getElementById('ana-countries').textContent = '—';
    document.getElementById('ana-country-list').innerHTML = '<div style="color:var(--muted);font-size:0.8rem">Loading...</div>';
    document.getElementById('ana-recent-list').innerHTML = '';

    const res = await api(`/analytics/${code}/json`);
    if (!res) return;
    const data = await res.json();

    document.getElementById('ana-url').textContent = '→ ' + data.original_url;
    document.getElementById('ana-total').textContent = data.total_clicks;
    document.getElementById('ana-countries').textContent = Object.keys(data.clicks_by_country).length;

    // Country bars
    const maxClicks = Math.max(...Object.values(data.clicks_by_country), 1);
    document.getElementById('ana-country-list').innerHTML = Object.entries(data.clicks_by_country)
      .sort((a,b) => b[1]-a[1])
      .map(([country, count]) => `
        <div class="country-row">
          <span class="country-name">${country}</span>
          <div class="country-bar-wrap"><div class="country-bar" style="width:${(count/maxClicks*100)}%"></div></div>
          <span class="country-count">${count}</span>
        </div>
      `).join('') || '<div style="color:var(--muted);font-size:0.8rem">No data yet</div>';

    // Recent clicks
    document.getElementById('ana-recent-list').innerHTML = data.recent_clicks.map(c => `
      <div class="click-row">
        <span class="click-time">${formatTime(c.clicked_at)}</span>
        <span class="click-country">${c.country || '—'}</span>
        <span class="click-ref">${c.referrer ? new URL(c.referrer).hostname : 'direct'}</span>
      </div>
    `).join('') || '<div style="color:var(--muted);font-size:0.8rem;padding:0.5rem 0">No clicks yet</div>';
  }

  // ── Utilities ─────────────────────────────────────────────────────
  function copyShortUrl() {
    copyText(lastShortUrl, document.getElementById('copy-btn'));
  }

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
      }
      showToast('Copied to clipboard');
    });
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
  }

  function formatTime(iso) {
    return new Date(iso).toLocaleString('en-GB', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  }

  // Enter key on URL input
  document.getElementById('new-url').addEventListener('keydown', e => {
    if (e.key === 'Enter') createLink();
  });

  init();
</script>
</body>
</html>
