<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkFlare — URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #111827;
      --surface:  #1a2332;
      --card:     #1e2d3d;
      --border:   #2d4a66;
      --accent:   #38bdf8;
      --accent2:  #fb923c;
      --green:    #34d399;
      --red:      #f87171;
      --text:     #e2e8f0;
      --muted:    #94a3b8;
      --white:    #f8fafc;
      --glow:     0 0 24px rgba(56,189,248,0.2);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(56,189,248,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(17,24,39,0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--white);
    }

    .logo span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }

    .user-badge {
      display: none;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.35rem 0.7rem;
      border-radius: 20px;
    }

    .user-badge.visible { display: flex; }
    .user-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }

    .btn-ghost { background: transparent; border-color: var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.05); }

    .btn-primary { background: var(--accent); color: #0f172a; font-weight: 700; }
    .btn-primary:hover { background: #7dd3fc; box-shadow: var(--glow); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-danger {
      background: transparent;
      border: 1px solid rgba(248,113,113,0.4);
      color: var(--red);
      font-size: 0.68rem;
      padding: 0.3rem 0.55rem;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.15s;
    }

    .btn-danger:hover { background: var(--red); color: white; border-color: var(--red); }

    /* Pages — KEY FIX: auth page uses flex when active */
    .page { display: none; }
    .page.active { display: block; }
    #auth-page.active { display: flex; }

    #auth-page {
      min-height: calc(100vh - 62px);
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      animation: fadeUp 0.3s ease forwards;
    }

    .auth-hero { text-align: center; margin-bottom: 1.75rem; }
    .auth-hero-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .auth-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--white); margin-bottom: 0.3rem; }
    .auth-sub { color: var(--muted); font-size: 0.78rem; }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
    }

    .auth-tabs {
      display: flex;
      background: var(--surface);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 1.5rem;
      gap: 3px;
    }

    .auth-tab {
      flex: 1;
      padding: 0.5rem;
      text-align: center;
      cursor: pointer;
      font-size: 0.75rem;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      transition: all 0.15s;
    }

    .auth-tab.active { background: var(--accent); color: #0f172a; }

    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 0.65rem 0.85rem;
      border-radius: 7px;
      outline: none;
      transition: all 0.15s;
    }

    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.1); }
    input::placeholder { color: var(--muted); opacity: 0.5; }

    .btn-block { width: 100%; padding: 0.7rem; font-size: 0.82rem; margin-top: 0.5rem; }

    .auth-msg {
      border-radius: 7px;
      padding: 0.6rem 0.85rem;
      font-size: 0.75rem;
      margin-bottom: 1rem;
      display: none;
    }

    .auth-msg.error { display: block; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
    .auth-msg.success { display: block; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); color: var(--green); }

    /* Dashboard */
    #dashboard-page { padding: 1.5rem 2rem 3rem; max-width: 1100px; margin: 0 auto; }

    .dash-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem; padding-top: 0.5rem; }
    .dash-greeting { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--white); }
    .dash-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .stat-card:hover { border-color: var(--accent); }
    .stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--accent); opacity: 0.6; }
    .stat-card:nth-child(2)::after { background: var(--accent2); }
    .stat-card:nth-child(3)::after { background: var(--green); }

    .stat-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 1.75rem; font-weight: 800; color: var(--white); line-height: 1; }

    .create-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
    .section-title { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 1rem; font-weight: 600; }

    .create-row { display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap; }
    .create-row .form-group { margin-bottom: 0; }
    .create-row .fg-url { flex: 2; min-width: 220px; }
    .create-row .fg-code { flex: 1; min-width: 140px; }

    .create-success-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.25);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .create-success-bar.visible { display: flex; }
    .short-link-result { font-size: 0.82rem; color: var(--green); }
    .short-link-result a { color: var(--green); text-decoration: none; font-weight: 600; }
    .short-link-result a:hover { text-decoration: underline; }
    .action-btns { display: flex; gap: 0.5rem; }

    .sm-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.3rem 0.65rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sm-btn-green { border: 1px solid var(--green); background: transparent; color: var(--green); }
    .sm-btn-green:hover, .sm-btn-green.copied { background: var(--green); color: #0f172a; }
    .sm-btn-close { border: 1px solid var(--border); background: transparent; color: var(--muted); }
    .sm-btn-close:hover { border-color: var(--red); color: var(--red); }

    .links-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .links-header { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--border); }
    .links-header .section-title { margin-bottom: 0; }

    .refresh-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      padding: 0.28rem 0.6rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.63rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; padding: 0.65rem 1.25rem; border-bottom: 1px solid var(--border); font-weight: 600; }
    td { padding: 0.85rem 1.25rem; font-size: 0.8rem; border-bottom: 1px solid rgba(45,74,102,0.4); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(56,189,248,0.03); }

    .code-pill {
      display: inline-flex;
      align-items: center;
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.2);
      border-radius: 5px;
      padding: 0.2rem 0.55rem;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.78rem;
      text-decoration: none;
      transition: all 0.15s;
    }

    .code-pill:hover { background: rgba(56,189,248,0.18); }
    .url-cell { color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .td-actions { display: flex; gap: 0.4rem; align-items: center; }

    .act-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 0.28rem 0.55rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .act-btn:hover { border-color: var(--accent); color: var(--accent); }
    .act-btn.copy:hover, .act-btn.copy.copied { border-color: var(--green); color: var(--green); }

    .empty-state { padding: 2.5rem; text-align: center; color: var(--muted); font-size: 0.8rem; }
    .empty-icon { font-size: 2rem; margin-bottom: 0.6rem; }

    /* Analytics */
    #analytics-page { padding: 1.5rem 2rem 3rem; max-width: 1100px; margin: 0 auto; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 1.25rem;
      padding: 0;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--accent); }

    .ana-hero { margin-bottom: 1.5rem; }
    .ana-code-title { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; color: var(--white); }
    .ana-code-title span { color: var(--accent); }
    .ana-orig-url { font-size: 0.76rem; color: var(--muted); margin-top: 0.2rem; word-break: break-all; }

    .ana-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .ana-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

    .ana-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
    .ana-card-title { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; font-weight: 600; }

    .country-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; border-bottom: 1px solid rgba(45,74,102,0.4); font-size: 0.78rem; }
    .country-item:last-child { border-bottom: none; }
    .country-name { color: var(--text); min-width: 80px; }
    .country-bar-bg { flex: 1; height: 5px; background: var(--surface); border-radius: 3px; overflow: hidden; }
    .country-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7dd3fc); border-radius: 3px; transition: width 0.6s ease; }
    .country-cnt { color: var(--accent); font-weight: 700; min-width: 24px; text-align: right; }

    .click-entry { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid rgba(45,74,102,0.4); font-size: 0.72rem; }
    .click-entry:last-child { border-bottom: none; }
    .click-entry.hdr { color: var(--muted); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .click-t { color: var(--muted); }
    .click-c { color: var(--text); }
    .click-r { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.75rem;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.22s;
      z-index: 999;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.err { border-left-color: var(--red); }

    .spinner {
      display: inline-block;
      width: 11px; height: 11px;
      border: 2px solid rgba(56,189,248,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.3rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 640px) {
      header { padding: 0.85rem 1rem; }
      #dashboard-page, #analytics-page { padding: 1rem 1rem 2rem; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .create-row { flex-direction: column; }
      .create-row .fg-url, .create-row .fg-code { min-width: 100%; }
      .create-row .btn { width: 100%; }
      th:nth-child(4), td:nth-child(4) { display: none; }
      .ana-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">Link<span>Flare</span> 🔥</div>
    <div class="header-right">
      <div class="user-badge" id="user-badge">
        <div class="user-dot"></div>
        <span id="user-email-display"></span>
      </div>
      <button class="btn btn-ghost" id="logout-btn" style="display:none" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Auth -->
  <div class="page" id="auth-page">
    <div class="auth-box">
      <div class="auth-hero">
        <div class="auth-hero-icon">🔥</div>
        <div class="auth-title">LinkFlare</div>
        <div class="auth-sub">Shorten URLs. Track every click.</div>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
          <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
        </div>
        <div class="auth-msg" id="auth-msg"></div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="auth-password" placeholder="••••••••"
            onkeydown="if(event.key==='Enter') submitAuth()" />
        </div>
        <button class="btn btn-primary btn-block" id="auth-btn" onclick="submitAuth()">Login</button>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="page" id="dashboard-page">
    <div class="dash-header">
      <div>
        <div class="dash-greeting" id="dash-greeting">Dashboard</div>
        <div class="dash-sub" id="dash-sub"></div>
      </div>
      <button class="btn btn-primary" onclick="focusCreateUrl()">+ Shorten URL</button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Links</div>
        <div class="stat-value" id="stat-links">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Clicks</div>
        <div class="stat-value" id="stat-clicks">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top Link</div>
        <div class="stat-value" id="stat-top" style="font-size:1.1rem;padding-top:0.3rem">—</div>
      </div>
    </div>

    <div class="create-card">
      <div class="section-title">Shorten a URL</div>
      <div class="create-row">
        <div class="form-group fg-url">
          <label>Paste your long URL</label>
          <input type="url" id="new-url" placeholder="https://example.com/very/long/path" />
        </div>
        <div class="form-group fg-code">
          <label>Custom code <span style="opacity:0.5;font-size:0.6rem">(optional)</span></label>
          <input type="text" id="new-code" placeholder="my-brand" />
        </div>
        <button class="btn btn-primary" id="create-btn" onclick="createLink()" style="white-space:nowrap">Shorten →</button>
      </div>
      <div class="create-success-bar" id="create-success">
        <div class="short-link-result">✓ <a id="created-url" href="#" target="_blank"></a></div>
        <div class="action-btns">
          <button class="sm-btn sm-btn-green" id="copy-btn" onclick="copyShortUrl()">Copy</button>
          <button class="sm-btn sm-btn-close" onclick="hideSuccess()">✕</button>
        </div>
      </div>
    </div>

    <div class="links-card">
      <div class="links-header">
        <div class="section-title">Your Links</div>
        <button class="refresh-btn" onclick="loadLinks()">↻ Refresh</button>
      </div>
      <div id="links-container">
        <div class="empty-state"><span class="spinner"></span> Loading your links...</div>
      </div>
    </div>
  </div>

  <!-- Analytics -->
  <div class="page" id="analytics-page">
    <button class="back-link" onclick="showDashboard()">← Back to Dashboard</button>
    <div class="ana-hero">
      <div class="ana-code-title">/<span id="ana-code"></span></div>
      <div class="ana-orig-url" id="ana-url"></div>
    </div>
    <div class="ana-stats">
      <div class="stat-card">
        <div class="stat-label">Total Clicks</div>
        <div class="stat-value" id="ana-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unique Countries</div>
        <div class="stat-value" id="ana-countries">—</div>
      </div>
    </div>
    <div class="ana-grid">
      <div class="ana-card">
        <div class="ana-card-title">Clicks by Country</div>
        <div id="ana-country-list"></div>
      </div>
      <div class="ana-card">
        <div class="ana-card-title">Recent Clicks</div>
        <div class="click-entry hdr"><div>Time</div><div>Country</div><div>Source</div></div>
        <div id="ana-recent-list"></div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const BASE = window.location.origin;
  let token = localStorage.getItem('lf_token');
  let userEmail = localStorage.getItem('lf_email');
  let lastShortUrl = '';

  // Boot
  (function init() {
    if (token) {
      showDashboard();
    } else {
      showPage('auth-page');
    }
  })();

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function showDashboard() {
    showPage('dashboard-page');
    const h = new Date().getHours();
    const g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    const name = userEmail ? userEmail.split('@')[0] : '';
    document.getElementById('dash-greeting').textContent = `${g}${name ? ', ' + name : ''} 👋`;
    document.getElementById('dash-sub').textContent = new Date().toLocaleDateString('en-US', {weekday:'long',month:'long',day:'numeric'});
    document.getElementById('user-badge').classList.add('visible');
    document.getElementById('user-email-display').textContent = userEmail || '';
    document.getElementById('logout-btn').style.display = '';
    loadLinks();
  }

  // Auth
  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('auth-btn').textContent = tab === 'login' ? 'Login' : 'Create Account';
    document.getElementById('auth-btn').dataset.tab = tab;
    const m = document.getElementById('auth-msg');
    m.className = 'auth-msg'; m.textContent = '';
  }

  async function submitAuth() {
    const tab = document.getElementById('auth-btn').dataset.tab || 'login';
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const msgEl = document.getElementById('auth-msg');
    msgEl.className = 'auth-msg'; msgEl.textContent = '';

    if (!email || !password) {
      msgEl.textContent = 'Please fill in both fields.';
      msgEl.className = 'auth-msg error';
      return;
    }

    const btn = document.getElementById('auth-btn');
    btn.innerHTML = '<span class="spinner"></span>Please wait...';
    btn.disabled = true;

    try {
      if (tab === 'register') {
        const r = await fetch(`${BASE}/auth/register`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email, password})
        });
        if (!r.ok) { const d = await r.json(); throw new Error(d.detail || 'Registration failed'); }
        msgEl.textContent = 'Account created! Signing you in...';
        msgEl.className = 'auth-msg success';
      }

      const r = await fetch(`${BASE}/auth/login`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email, password})
      });

      if (!r.ok) { const d = await r.json(); throw new Error(d.detail || 'Invalid email or password'); }

      const data = await r.json();
      token = data.access_token;
      userEmail = email;
      localStorage.setItem('lf_token', token);
      localStorage.setItem('lf_email', email);
      showDashboard();

    } catch(e) {
      msgEl.textContent = e.message;
      msgEl.className = 'auth-msg error';
    } finally {
      btn.textContent = tab === 'login' ? 'Login' : 'Create Account';
      btn.disabled = false;
    }
  }

  function logout() {
    token = null; userEmail = null;
    localStorage.removeItem('lf_token');
    localStorage.removeItem('lf_email');
    document.getElementById('user-badge').classList.remove('visible');
    document.getElementById('logout-btn').style.display = 'none';
    showPage('auth-page');
  }

  // API
  async function api(path, opts = {}) {
    const res = await fetch(`${BASE}${path}`, {
      ...opts,
      headers: {'Content-Type':'application/json', 'Authorization':`Bearer ${token}`, ...(opts.headers||{})}
    });
    if (res.status === 401) { logout(); return null; }
    return res;
  }

  // Links
  async function loadLinks() {
    document.getElementById('links-container').innerHTML =
      '<div class="empty-state"><span class="spinner"></span> Loading...</div>';
    const res = await api('/links/');
    if (!res) return;
    const links = await res.json();

    const totalClicks = links.reduce((s,l) => s + l.click_count, 0);
    document.getElementById('stat-links').textContent = links.length;
    document.getElementById('stat-clicks').textContent = totalClicks;
    const top = [...links].sort((a,b) => b.click_count - a.click_count)[0];
    document.getElementById('stat-top').textContent = top ? `/${top.code}` : '—';

    if (!links.length) {
      document.getElementById('links-container').innerHTML =
        '<div class="empty-state"><div class="empty-icon">🔗</div>No links yet — paste a URL above to get started.</div>';
      return;
    }

    const sorted = [...links].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    document.getElementById('links-container').innerHTML = `
      <table>
        <thead><tr>
          <th>Short Link</th><th>Destination</th><th>Clicks</th><th>Created</th><th>Actions</th>
        </tr></thead>
        <tbody>${sorted.map(l => `
          <tr>
            <td><a class="code-pill" href="${l.short_url}" target="_blank">/${l.code}</a></td>
            <td class="url-cell" title="${l.original_url}">${l.original_url}</td>
            <td style="font-weight:700;color:var(--white)">${l.click_count}</td>
            <td style="color:var(--muted);font-size:0.72rem">${fmtDate(l.created_at)}</td>
            <td class="td-actions">
              <button class="act-btn" onclick="showAnalytics('${l.code}')">Analytics</button>
              <button class="act-btn copy" onclick="copyText('${l.short_url}', this)">Copy</button>
              <button class="btn-danger" onclick="deleteLink('${l.code}')">✕</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  }

  async function createLink() {
    const url = document.getElementById('new-url').value.trim();
    const code = document.getElementById('new-code').value.trim();
    if (!url) { showToast('Please enter a URL', true); return; }

    const btn = document.getElementById('create-btn');
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;

    try {
      const body = {original_url: url};
      if (code) body.custom_code = code;
      const res = await api('/links/', {method:'POST', body:JSON.stringify(body)});
      if (!res) return;
      const data = await res.json();
      if (!res.ok) { showToast(data.detail || 'Failed', true); return; }

      lastShortUrl = data.short_url;
      document.getElementById('created-url').textContent = data.short_url;
      document.getElementById('created-url').href = data.short_url;
      document.getElementById('create-success').classList.add('visible');
      document.getElementById('new-url').value = '';
      document.getElementById('new-code').value = '';
      document.getElementById('copy-btn').textContent = 'Copy';
      document.getElementById('copy-btn').classList.remove('copied');
      loadLinks();
      showToast('Short link created! ✓');
    } finally {
      btn.textContent = 'Shorten →';
      btn.disabled = false;
    }
  }

  async function deleteLink(code) {
    if (!confirm(`Delete /${code}? All click data will be lost.`)) return;
    const res = await api(`/links/${code}`, {method:'DELETE'});
    if (res && res.ok) { showToast(`/${code} deleted`); loadLinks(); }
  }

  function focusCreateUrl() {
    const el = document.getElementById('new-url');
    el.focus();
    el.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function hideSuccess() { document.getElementById('create-success').classList.remove('visible'); }
  function copyShortUrl() { copyText(lastShortUrl, document.getElementById('copy-btn')); }

  // Analytics
  async function showAnalytics(code) {
    showPage('analytics-page');
    document.getElementById('ana-code').textContent = code;
    document.getElementById('ana-url').textContent = 'Loading...';
    document.getElementById('ana-total').textContent = '—';
    document.getElementById('ana-countries').textContent = '—';
    document.getElementById('ana-country-list').innerHTML =
      '<div style="color:var(--muted);font-size:0.78rem"><span class="spinner"></span> Loading...</div>';
    document.getElementById('ana-recent-list').innerHTML = '';

    const res = await api(`/analytics/${code}/json`);
    if (!res) return;
    const data = await res.json();

    document.getElementById('ana-url').textContent = '→ ' + data.original_url;
    document.getElementById('ana-total').textContent = data.total_clicks;
    document.getElementById('ana-countries').textContent = Object.keys(data.clicks_by_country).length;

    const maxC = Math.max(...Object.values(data.clicks_by_country), 1);
    document.getElementById('ana-country-list').innerHTML =
      Object.entries(data.clicks_by_country).sort((a,b)=>b[1]-a[1]).map(([c,n]) => `
        <div class="country-item">
          <span class="country-name">${c}</span>
          <div class="country-bar-bg"><div class="country-bar-fill" style="width:${(n/maxC*100).toFixed(1)}%"></div></div>
          <span class="country-cnt">${n}</span>
        </div>`).join('') ||
      '<div style="color:var(--muted);font-size:0.78rem;padding:0.5rem 0">No clicks yet</div>';

    document.getElementById('ana-recent-list').innerHTML =
      data.recent_clicks.map(c => {
        let ref = 'direct';
        try { ref = c.referrer ? new URL(c.referrer).hostname : 'direct'; } catch(e){}
        return `<div class="click-entry">
          <span class="click-t">${fmtTime(c.clicked_at)}</span>
          <span class="click-c">${c.country||'—'}</span>
          <span class="click-r">${ref}</span>
        </div>`;
      }).join('') ||
      '<div style="color:var(--muted);font-size:0.78rem;padding:0.5rem 0">No clicks yet</div>';
  }

  // Utils
  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
      }
      showToast('Copied ✓');
    });
  }

  function showToast(msg, isErr=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isErr ? ' err' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function fmtDate(iso) {
    return new Date(iso + (iso.endsWith('Z')?'':'Z')).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }

  function fmtTime(iso) {
    return new Date(iso + (iso.endsWith('Z')?'':'Z')).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  }

  document.getElementById('new-url').addEventListener('keydown', e => { if(e.key==='Enter') createLink(); });
</script>
</body>
</html>
